<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استمارة تسجيل ونقل طالب - نموذج تجريبي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a4d2e;
      --bg: #f8faf8;
      --card-bg: #ffffff;
      --text: #2d3748;
      --border: #e2e8f0;
      --success: #15803d;
      --error: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 35px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .form-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .form-header h2 {
      color: var(--primary);
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .form-header p {
      color: #718096;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 700;
    }

    input, select, textarea {
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 13px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .btn-submit:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    /* رسائل الحالة */
    .status-msg {
      display: none;
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 600;
    }

    .status-msg.success {
      background: #dcfce7;
      color: var(--success);
      border: 1px solid #bbf7d0;
    }

    .status-msg.error {
      background: #fee2e2;
      color: var(--error);
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="form-header">
      <h2>مدرسة التعليم الخاصة</h2>
      <p>استمارة تسجيل ونقل طالب (نموذج تجريبي)</p>
    </div>

    <form id="contactForm" action="https://formspree.io/f/xoevnrlj" method="POST">
      
      <div class="form-group">
        <label for="student_name">اسم الطالب كاملاً</label>
        <input type="text" id="student_name" name="اسم الطالب" placeholder="أدخل اسم الطالب الرباعي" required>
      </div>

      <div class="form-group">
        <label for="target_stage">المرحلة الدراسية المراد النقل إليها</label>
        <select id="target_stage" name="المرحلة المطلوبة" required>
          <option value="" disabled selected>اختر المرحلة...</option>
          <option value="الروضة / التمهيدي">الروضة / التمهيدي</option>
          <option value="المرحلة الابتدائية">المرحلة الابتدائية</option>
          <option value="المرحلة المتوسطة">المرحلة المتوسطة</option>
          <option value="المرحلة الثانوية">المرحلة الثانوية</option>
        </select>
      </div>

      <div class="form-group">
        <label for="guardian_name">اسم ولي الأمر</label>
        <input type="text" id="guardian_name" name="اسم ولي الأمر" placeholder="الاسم الكامل لولي الأمر" required>
      </div>

      <div class="form-group">
        <label for="phone">رقم هاتف التواصل</label>
        <input type="tel" id="phone" name="رقم الهاتف" placeholder="05XXXXXXXX" required>
      </div>

      <div class="form-group">
        <label for="notes">ملاحظات إضافية (اختياري)</label>
        <textarea id="notes" name="ملاحظات" rows="3" placeholder="المدرسة السابقة أو أي تفاصيل تخص النقل..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">إرسال الطلب</button>
      
      <div id="statusMessage" class="status-msg"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري الإرسال...';
      statusMsg.style.display = 'none';

      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          statusMsg.className = 'status-msg success';
          statusMsg.textContent = 'تم إرسال طلبك بنجاح! ستصلك التفاصيل على البريد.';
          statusMsg.style.display = 'block';
          form.reset();
        } else {
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = 'حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.';
          statusMsg.style.display = 'block';
        }
      } catch (error) {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'تعذر الاتصال بالخادم، تأكد من اتصال الإنترنت.';
        statusMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'إرسال الطلب';
      }
    });
  </script>

</body>
</html>
