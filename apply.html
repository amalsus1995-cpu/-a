<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استمارة القبول والتسجيل | مدرسة التعليم الخاصة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #155e37;
      --primary-light: #1e7e4a;
      --primary-dark: #0d3d23;
      --bg: #f4f7f5;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 15px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: var(--primary);
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .btn-back {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 6px;
      transition: var(--transition);
    }

    .btn-back:hover {
      background: #f1f5f3;
    }

    .main-content {
      flex: 1;
      max-width: 650px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 35px;
      box-shadow: var(--shadow);
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-header h2 {
      color: var(--primary-dark);
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .form-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #374151;
    }

    input, select, textarea {
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
      background: #fafafa;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(21, 94, 55, 0.1);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(21, 94, 55, 0.3);
    }

    .btn-submit:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }

    .status-alert {
      display: none;
      padding: 14px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 700;
    }

    .status-alert.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .status-alert.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    footer {
      background: var(--primary-dark);
      color: #cbd5e1;
      padding: 20px;
      text-align: center;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">
      <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
      <div class="brand-text">
        <h1>مدرسة التعليم الخاصة</h1>
      </div>
    </a>
    <a href="index.html" class="btn-back">
      <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
    </a>
  </header>

  <main class="main-content">
    <div class="form-card">
      <div class="form-header">
        <h2>استمارة تقديم طلب جديد</h2>
        <p>يرجى تعبئة الحقول للتواصل معكم وتحديد موعد المقابلة المدرسية</p>
      </div>

      <form id="applyForm" action="https://formspree.io/f/xoevnrlj" method="POST">
        <div class="form-group">
          <label for="studentName">اسم الطالب كاملاً</label>
          <input type="text" id="studentName" name="اسم الطالب" placeholder="الاسم الرباعي للطالب" required>
        </div>

        <div class="form-group">
          <label for="stage">المرحلة الدراسية المراد الالتحاق بها</label>
          <select id="stage" name="المرحلة الدراسية" required>
            <option value="" disabled selected>اختر المرحلة...</option>
            <option value="الروضة والتمهيدي">الروضة والتمهيدي</option>
            <option value="المرحلة الابتدائية">المرحلة الابتدائية</option>
            <option value="المرحلة المتوسطة">المرحلة المتوسطة</option>
            <option value="المرحلة الثانوية">المرحلة الثانوية</option>
          </select>
        </div>

        <div class="form-group">
          <label for="guardianName">اسم ولي الأمر</label>
          <input type="text" id="guardianName" name="اسم ولي الأمر" placeholder="الاسم الكامل لولي الأمر" required>
        </div>

        <div class="form-group">
          <label for="phone">رقم هاتف التواصل</label>
          <input type="tel" id="phone" name="رقم الهاتف" placeholder="05XXXXXXXX" required>
        </div>

        <div class="form-group">
          <label for="notes">ملاحظات أو تفاصيل النقل (اختياري)</label>
          <textarea id="notes" name="الملاحظات" rows="3" placeholder="المدرسة السابقة، أو أي تفاصيل تخص رغبة النقل..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <i class="fa-solid fa-paper-plane"></i> إرسال الطلب
        </button>

        <div id="statusMessage" class="status-alert"></div>
      </form>
    </div>
  </main>

  <footer>
    <p>جميع الحقوق محفوظة &copy; مدرسة التعليم الخاصة 2026</p>
  </footer>

  <script>
    const form = document.getElementById('applyForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إرسال الطلب...';
      statusMsg.style.display = 'none';

      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          statusMsg.className = 'status-alert success';
          statusMsg.innerHTML = '<i class="fa-solid fa-circle-check"></i> تم استلام طلبك بنجاح! ستصلك تفاصيل المراجعة على الإيميل.';
          statusMsg.style.display = 'block';
          form.reset();
        } else {
          statusMsg.className = 'status-alert error';
          statusMsg.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> حدث خطأ أثناء الإرسال، حاول مجدداً.';
          statusMsg.style.display = 'block';
        }
      } catch (err) {
        statusMsg.className = 'status-alert error';
        statusMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> تعذر الاتصال بالخادم، تأكد من الإنترنت.';
        statusMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> إرسال الطلب';
      }
    });
  </script>

</body>
</html>
